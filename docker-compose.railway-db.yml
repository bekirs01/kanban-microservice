services:
  auth-service:
    depends_on:
      db: !reset null
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: ${RAILWAY_DB_HOST}
      DB_PORT: ${RAILWAY_DB_PORT}
      DB_USER: ${RAILWAY_DB_USER}
      DB_PASS: ${RAILWAY_DB_PASS}
      DB_NAME: ${RAILWAY_DB_NAME}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-jungle_super_secret_key_123}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://admin:admin@rabbitmq:5672}

  tasks-service:
    depends_on:
      db: !reset null
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: ${RAILWAY_DB_HOST}
      DB_PORT: ${RAILWAY_DB_PORT}
      DB_USER: ${RAILWAY_DB_USER}
      DB_PASS: ${RAILWAY_DB_PASS}
      DB_NAME: ${RAILWAY_DB_NAME}
      DB_SSL: ${DB_SSL:-false}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://admin:admin@rabbitmq:5672}

  notifications-service:
    depends_on:
      db: !reset null
      rabbitmq:
        condition: service_healthy
    environment:
      DB_HOST: ${RAILWAY_DB_HOST}
      DB_PORT: ${RAILWAY_DB_PORT}
      DB_USER: ${RAILWAY_DB_USER}
      DB_PASS: ${RAILWAY_DB_PASS}
      DB_NAME: ${RAILWAY_DB_NAME}
      DB_SSL: ${DB_SSL:-false}
      JWT_SECRET: ${JWT_SECRET:-jungle_super_secret_key_123}
      RABBITMQ_URI: ${RABBITMQ_URI:-amqp://admin:admin@rabbitmq:5672}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_PERSONAL_CHAT_ID: ${TELEGRAM_PERSONAL_CHAT_ID:-}
      TELEGRAM_REMINDER_WINDOW_HOURS: ${TELEGRAM_REMINDER_WINDOW_HOURS:-24}
      TELEGRAM_REMINDER_SCAN_INTERVAL_MINUTES: ${TELEGRAM_REMINDER_SCAN_INTERVAL_MINUTES:-10}

  api-gateway:
    environment:
      JWT_SECRET: ${JWT_SECRET:-jungle_super_secret_key_123}
